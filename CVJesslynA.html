<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jill Valencia — CV</title>
  <style>
    :root{
      --bg:#f4cfd4; /* soft pink, slightly muted */
      --card:#ffffff;
      --accent:#d07b86;
      --muted:#6b6b6b;
      --heading:#222222;
      --max-width:920px;
      --radius:14px;
      --gap:20px;
      --font-sans: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }
    html,body{height:100%;margin:0;font-family:var(--font-sans);background:linear-gradient(180deg,var(--bg),#f7dbe0 60%);color:var(--heading);-webkit-font-smoothing:antialiased;}
    .wrap{max-width:var(--max-width);margin:32px auto;padding:24px;}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:0 12px 40px rgba(34,34,34,0.08);overflow:hidden;display:grid;grid-template-columns: 320px 1fr;gap:var(--gap);}
    /* Sidebar */
    .side{background:linear-gradient(180deg, rgba(208,123,134,0.06), rgba(208,123,134,0.03));padding:28px;display:flex;flex-direction:column;gap:18px;min-width:260px;}
    .photo-wrap{display:flex;gap:16px;align-items:center;}
    .photo{width:120px;height:120px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#f2a6b2);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;box-shadow:0 8px 22px rgba(208,123,134,0.18);overflow:hidden;}
    .photo img{width:100%;height:100%;object-fit:cover;display:block;}
    .name{font-size:20px;font-weight:700;letter-spacing:0.4px;}
    .role{color:var(--muted);font-size:13px;margin-top:4px;}
    .section-title{font-size:12px;font-weight:700;color:var(--accent);margin-top:6px;text-transform:uppercase;letter-spacing:1px;}
    .contact{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.6;}
    .skills-list, .lang-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:14px;color:var(--muted);}
    .pill{display:inline-block;background:rgba(208,123,134,0.12);color:var(--heading);padding:6px 10px;border-radius:999px;font-size:13px;margin-top:8px;}
    /* Main */
    .main{padding:28px;}
    .about{font-size:15px;color:#333;line-height:1.6;}
    .card-block{background:linear-gradient(180deg,#fff,#fff);border-radius:10px;padding:14px;box-shadow:0 6px 18px rgba(34,34,34,0.04);}
    .muted{color:var(--muted);font-size:13px;}
    h3{margin:0;font-size:16px;color:var(--heading);}
    .small{font-size:13px;color:var(--muted);}
    .meta{font-size:13px;color:var(--muted);margin-top:6px;}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
    .tag{background:rgba(208,123,134,0.08);padding:6px 10px;border-radius:8px;font-size:13px;color:var(--heading);}
    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid rgba(34,34,34,0.06);background:#fff;color:var(--heading);cursor:pointer;font-size:13px;
    }
    /* Responsive */
    @media (max-width:900px){
      .card{grid-template-columns:1fr;gap:12px}
      .side{flex-direction:row;align-items:center;padding:16px}
      .main{padding:16px}
    }
    /* Print */
    @media print{
      body{background:white}
      .wrap{box-shadow:none;margin:0}
      .card{box-shadow:none;border-radius:0}
      .btn, input, label { display:none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="document" aria-label="Curriculum Vitae Jill Valencia">
      <!-- SIDEBAR -->
      <aside class="side" aria-label="Kontak dan Keahlian">
        <div class="photo-wrap">
          <div class="photo" id="photoBox" aria-hidden="true">
            <span id="initials">JV</span>
