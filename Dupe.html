<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumora — A garden that glows after dark</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Iconify CDN -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

        :root { --bg: #000000; --fg: #ffffff; }

        .font-serif-instrument { font-family: 'Instrument Serif', serif; }

        #cosmic-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* soft pool of shade behind the headline so it stays readable over the galaxy */
        .headline-halo::before {
            content: '';
            position: absolute;
            left: 50%; top: 50%;
            width: 120%; height: 160%;
            transform: translate(-50%, -50%);
            background: radial-gradient(closest-side, rgba(20, 3, 18, 0.55), rgba(20, 3, 18, 0) 100%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .rise   { animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both; }
        .rise-2 { animation-delay: .25s; }
        .rise-3 { animation-delay: .5s; }
        .rise-4 { animation-delay: .75s; }

        /* LIQUID GLASS CSS */
        .liquid-glass {
            background: rgba(0, 0, 0, 0.10);
            background-blend-mode: luminosity;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%,  rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .liquid-glass-circle {
            background-blend-mode: luminosity;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass-circle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.22) 30%,
                rgba(255,255,255,0.16) 50%, rgba(255,255,255,0.22) 70%,
                rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen selection:bg-white selection:text-black overflow-hidden">

    <!-- ANIMATED NIGHT GARDEN (fixed, behind everything) -->
    <canvas id="cosmic-canvas"></canvas>

    <div class="text-white min-h-screen selection:bg-white selection:text-black overflow-hidden">
        <section class="min-h-screen relative overflow-hidden flex flex-col">

            <nav class="relative z-20 px-6 py-6 rise">
                <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-6 pr-1.5 py-1.5 flex items-center justify-between">

                    <!-- Left Group -->
                    <div class="flex items-center gap-2">
                        <!-- blossom mark -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true" class="w-6 h-6">
                            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                                <ellipse cx="12" cy="6.2" rx="2.3" ry="3.6"/>
                                <ellipse cx="12" cy="6.2" rx="2.3" ry="3.6" transform="rotate(72 12 12)"/>
                                <ellipse cx="12" cy="6.2" rx="2.3" ry="3.6" transform="rotate(144 12 12)"/>
                                <ellipse cx="12" cy="6.2" rx="2.3" ry="3.6" transform="rotate(216 12 12)"/>
                                <ellipse cx="12" cy="6.2" rx="2.3" ry="3.6" transform="rotate(288 12 12)"/>
                            </g>
                            <circle cx="12" cy="12" r="2" fill="currentColor"/>
                        </svg>
                        <span class="font-semibold text-lg tracking-tight">Lumora</span>

                        <div class="hidden md:flex gap-8 ml-8">
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Wander</a>
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Seasons</a>
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Say hello</a>
                        </div>
                    </div>

                    <!-- Right Group -->
                    <div class="flex items-center gap-4">
                        <button class="text-white text-sm font-medium">Sign In</button>
                        <button class="bg-white rounded-full px-5 py-2 text-black text-sm font-medium whitespace-nowrap hover:scale-105 transition-transform duration-300">Enter the Garden</button>
                    </div>

                </div>
            </nav>

            <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]">

                <div class="headline-halo relative flex flex-col items-center">
                    <!-- Eyebrow -->
                    <p class="rise rise-2 text-pink-200/70 text-xs tracking-[0.35em] uppercase mb-5"
                       style="text-shadow: 0 0 24px rgba(0,0,0,.6);">
                        ✦ &nbsp;open after sunset&nbsp; ✦
                    </p>

                    <!-- Headline -->
                    <h1 class="rise rise-2 text-5xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight max-w-5xl mb-4 leading-[1.02]"
                        style="text-shadow: 0 0 72px rgba(0, 0, 0, 0.5), 0 4px 28px rgba(0, 0, 0, 0.35);">
                        Wander through a garden of <em class="italic text-pink-200">starlight</em>
                    </h1>

                    <!-- Subline -->
                    <p class="rise rise-3 text-white/75 text-sm md:text-base leading-relaxed max-w-xl mb-10"
                       style="text-shadow: 0 0 30px rgba(0, 0, 0, 0.5), 0 1px 10px rgba(0, 0, 0, 0.3);">
                        One quiet walk beneath a pink galaxy, where every petal remembers the light.
                    </p>
                </div>

                <!-- Email Capture -->
                <div class="rise rise-4 max-w-xl w-full">
                    <div class="liquid-glass rounded-full pl-6 pr-1.5 py-1.5 flex items-center gap-3">
                        <input type="email" placeholder="Your email, for a lantern-lit invitation"
                               class="bg-transparent border-none outline-none flex-1 min-w-0 text-white placeholder:text-white/80 text-sm">
                        <button class="bg-white rounded-full px-6 py-3 text-black text-sm font-medium whitespace-nowrap hover:scale-105 transition-transform duration-300">Plant a Seed</button>
                    </div>
                </div>

            </div>

            <div class="relative z-10 flex justify-center gap-4 pb-12 rise rise-4">
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:instagram" class="text-xl"></iconify-icon>
                </button>
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:twitter" class="text-xl"></iconify-icon>
                </button>
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:globe" class="text-xl"></iconify-icon>
                </button>
            </div>

        </section>
    </div>

    <!-- NIGHT GARDEN SCENE -->
    <script>
    (() => {
        const canvas = document.getElementById('cosmic-canvas');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, dpr = 1;

        /* ---------- seeded random so the garden is the same every visit ---------- */
        function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        let rnd = mulberry(7);
        const R = (a, b) => a + rnd() * (b - a);

        /* ---------- pre-rendered glow sprites ---------- */
        function makeGlow(r, g, b) {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const x = c.getContext('2d');
            const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            gr.addColorStop(0,   `rgba(${r},${g},${b},1)`);
            gr.addColorStop(0.25,`rgba(${r},${g},${b},.45)`);
            gr.addColorStop(1,   `rgba(${r},${g},${b},0)`);
            x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
            return c;
        }
        const GLOW = [makeGlow(255, 120, 190), makeGlow(255, 225, 245), makeGlow(190, 140, 255), makeGlow(255, 215, 140)];

        function makeMist() {
            const c = document.createElement('canvas'); c.width = 512; c.height = 128;
            const x = c.getContext('2d');
            x.save(); x.scale(1, 0.25);
            const gr = x.createRadialGradient(256, 256, 0, 256, 256, 256);
            gr.addColorStop(0, 'rgba(255,170,220,.55)');
            gr.addColorStop(1, 'rgba(255,170,220,0)');
            x.fillStyle = gr; x.fillRect(0, 0, 512, 512); x.restore();
            return c;
        }
        const MIST = makeMist();

        /* ---------- terrain ---------- */
        const hill = (x, layer) => {
            const base = [0.735, 0.80, 0.91][layer];
            const amp  = [0.022, 0.020, 0.018][layer];
            return H * base
                 + Math.sin(x * 0.0035 + layer * 2.1) * H * amp
                 + Math.sin(x * 0.0102 + layer * 1.3) * H * amp * 0.45;
        };
        const ridge = (x, k) => H * (0.66 - k * 0.035)
                 - Math.abs(Math.sin(x * 0.0021 + k * 3.7)) * H * (0.07 + k * 0.02)
                 - Math.sin(x * 0.0074 + k) * H * 0.012;

        /* ---------- scene data ---------- */
        let stars = [], galaxy = [], flowers = [], fireflies = [], petals = [], shooting = [];
        const FLOWER_TYPES = ['daisy', 'cosmos', 'tulip', 'lupin', 'cosmos', 'daisy'];
        const PALETTE = {
            daisy:  [[330, 90, 92], [300, 80, 92], [20, 95, 90]],
            cosmos: [[325, 88, 62], [340, 85, 66], [290, 70, 68]],
            tulip:  [[345, 85, 62], [320, 80, 60], [10, 90, 66]],
            lupin:  [[285, 70, 66], [310, 75, 68], [265, 70, 70]]
        };

        function build() {
            rnd = mulberry(7);
            stars = Array.from({ length: Math.round(W * H / 5200) }, () => ({
                x: R(0, W), y: R(0, H * 0.7), s: Math.pow(rnd(), 2.4) * 1.9 + 0.35,
                a: rnd(), sp: R(0.4, 1.6), tint: rnd() < 0.3 ? '255,200,235' : '255,255,255'
            }));

            // spiral galaxy: two arms, ~1800 points
            galaxy = [];
            for (let i = 0; i < 1800; i++) {
                const r = Math.pow(rnd(), 0.75) * 300;
                const arm = (i % 2) * Math.PI;
                const th = arm + r * 0.016 + R(-0.35, 0.35) * (0.4 + r / 300);
                galaxy.push({ r, th, s: R(0.6, 1.9) * (r < 60 ? 1.2 : 1), a: R(0.25, 0.95) * (1 - r / 360) });
            }

            // flowers
            flowers = [];
            const add = (layer, count, hMin, hMax, sMin, sMax, yJit) => {
                for (let i = 0; i < count; i++) {
                    const x = R(-30, W + 30);
                    const type = FLOWER_TYPES[(rnd() * FLOWER_TYPES.length) | 0];
                    const pal = PALETTE[type][(rnd() * 3) | 0];
                    const y = hill(x, layer) + R(yJit[0], yJit[1]);
                    flowers.push({
                        x, by: y, h: R(hMin, hMax), size: R(sMin, sMax), type, hue: pal[0], sat: pal[1], lit: pal[2],
                        ph: R(0, 6.28), layer, front: layer === 2 || (layer === 1 && y > hill(x, 1) + 5),
                        glow: type === 'daisy' ? 1 : (type === 'lupin' ? 2 : 0), petals: type === 'daisy' ? 12 : 8
                    });
                }
            };
            const scale = Math.max(0.7, Math.min(1.5, H / 760));
            add(0, Math.round(W / 8),  8 * scale, 20 * scale, 1.6 * scale, 2.8 * scale, [0, 16]);
            add(1, Math.round(W / 11), 38 * scale, 78 * scale, 5 * scale, 9 * scale, [-4, 26]);
            add(2, Math.round(W / 70), 150 * scale, 270 * scale, 14 * scale, 24 * scale, [8, 40]);
            flowers.sort((a, b) => a.by - b.by);

            fireflies = Array.from({ length: 46 }, () => ({
                x: R(0, W), y: R(H * 0.45, H * 0.92), ph: R(0, 6.28), sp: R(0.25, 0.7), r: R(14, 30)
            }));
            petals = Array.from({ length: 46 }, () => newPetal(true));
        }

        function newPetal(anywhere) {
            return {
                x: R(-50, W + 50), y: anywhere ? R(0, H) : R(-40, -10), s: R(3, 9) * (H / 760),
                vy: R(14, 38), vx: R(-14, 14), a: R(0, 6.28), sp: R(-1.2, 1.2), sw: R(0, 6.28),
                c: rnd() > 0.5 ? '255,150,210' : '255,205,240', blur: rnd() < 0.2
            };
        }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            build();
            man.x = Math.min(man.x, W + 80);
        }

        /* ---------- the walker ---------- */
        const man = { x: -140, phase: 0, speed: 52 };
        let lantern = { x: -999, y: 0, r: 0 };
        const mScale = () => Math.max(0.75, Math.min(1.5, H / 760));

        function windAt(x, t) {
            return Math.sin(t * 0.0011 + x * 0.006) * 0.55 + Math.sin(t * 0.0027 + x * 0.013) * 0.25 + Math.sin(t * 0.0006 + x * 0.002) * 0.3;
        }
        function pushAt(x) {                         // flowers part around the walker
            const d = x - man.x, reach = 60 * mScale();
            if (Math.abs(d) > reach) return 0;
            return Math.sign(d || 1) * Math.pow(1 - Math.abs(d) / reach, 1.4);
        }
        function litAt(x, y) {
            const d = Math.hypot(x - lantern.x, (y - lantern.y) * 1.3);
            return Math.max(0, 1 - d / (230 * mScale()));
        }

        /* ---------- flower drawing ---------- */
        function drawFlower(f, t) {
            const push = f.layer === 1 ? pushAt(f.x) * 0.7 : 0;
            const lean = (windAt(f.x, t) * 0.12 + push * 0.55) * f.h * (f.layer === 2 ? 0.8 : 1) + Math.sin(t * 0.002 + f.ph) * f.h * 0.012;
            const tx = f.x + lean, ty = f.by - f.h;
            const cx = f.x + lean * 0.15, cy = f.by - f.h * 0.55;
            const lit = f.layer === 0 ? 0 : litAt(f.x, f.by - f.h * 0.5);
            const dim = [0.55, 1, 1][f.layer];

            // stem
            ctx.lineCap = 'round';
            ctx.strokeStyle = `hsl(${150 - lit * 20},${38 + lit * 10}%,${(13 + lit * 20) * dim + (f.layer === 2 ? 2 : 0)}%)`;
            ctx.lineWidth = Math.max(1, f.size * (f.type === 'lupin' ? 0.22 : 0.16));
            ctx.beginPath(); ctx.moveTo(f.x, f.by); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();

            if (f.layer === 0) {                      // far meadow: just a glowing speck
                const p = (Math.sin(t * 0.003 + f.ph) + 1) * 0.5;
                ctx.fillStyle = `hsla(${f.hue},${f.sat}%,${f.lit}%,${0.45 + p * 0.4})`;
                ctx.beginPath(); ctx.arc(tx, ty, f.size, 0, 6.283); ctx.fill();
                return;
            }

            // leaves
            if (f.type !== 'lupin') {
                const mx = f.x + (tx - f.x) * 0.3, my = f.by - f.h * 0.3;
                ctx.fillStyle = `hsl(${148},${40}%,${(14 + lit * 16) * dim}%)`;
                ctx.save(); ctx.translate(mx, my); ctx.rotate(-0.9 + lean * 0.004);
                ctx.beginPath(); ctx.ellipse(f.size * 0.9, 0, f.size * 1.1, f.size * 0.34, 0, 0, 6.283); ctx.fill();
                ctx.restore();
            }

            // soft glow under the bloom
            const pulse = (Math.sin(t * 0.0022 + f.ph) + 1) * 0.5;
            const ga = (0.13 + pulse * 0.12 + lit * 0.45) * (f.layer === 2 ? 0.7 : 1);
            const gs = f.size * (f.type === 'lupin' ? 3.2 : 4.6);
            ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = ga;
            ctx.drawImage(GLOW[f.glow], tx - gs, ty - gs, gs * 2, gs * 2);
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

            const L = f.lit + lit * 8;
            ctx.save(); ctx.translate(tx, ty); ctx.rotate(lean / f.h * 1.1);
            const s = f.size;

            if (f.type === 'daisy' || f.type === 'cosmos') {
                const n = f.petals, ry = f.type === 'daisy' ? 0.26 : 0.46, rx = f.type === 'daisy' ? 1 : 0.95;
                const open = 0.92 + Math.sin(t * 0.0018 + f.ph) * 0.05;
                for (let i = 0; i < n; i++) {
                    ctx.save(); ctx.rotate(i / n * 6.283 + f.ph);
                    ctx.fillStyle = `hsl(${f.hue},${f.sat}%,${L - (i % 2) * 4}%)`;
                    ctx.beginPath(); ctx.ellipse(s * rx * 0.62 * open, 0, s * rx * open, s * ry, 0, 0, 6.283); ctx.fill();
                    ctx.restore();
                }
                const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.36);
                cg.addColorStop(0, '#fff1b0'); cg.addColorStop(1, '#f0a23a');
                ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, 6.283); ctx.fill();
            } else if (f.type === 'tulip') {
                ctx.fillStyle = `hsl(${f.hue},${f.sat}%,${L - 6}%)`;
                ctx.beginPath(); ctx.moveTo(-s * 0.7, -s * 0.2);
                ctx.bezierCurveTo(-s * 0.9, s * 0.9, s * 0.9, s * 0.9, s * 0.7, -s * 0.2);
                ctx.lineTo(s * 0.3, -s * 1.5); ctx.lineTo(0, -s * 0.5); ctx.lineTo(-s * 0.3, -s * 1.5); ctx.closePath(); ctx.fill();
                ctx.fillStyle = `hsla(${f.hue},${f.sat}%,${L + 14}%,.8)`;
                ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.bezierCurveTo(-s * 0.5, s * 0.5, s * 0.5, s * 0.5, 0, -s * 0.5); ctx.fill();
            } else {                                   // lupin spike
                const n = 11;
                for (let i = 0; i < n; i++) {
                    const k = i / (n - 1), yy = k * f.h * 0.32, rr = s * 0.55 * (1 - k * 0.65);
                    const off = Math.sin(i * 2.1 + f.ph) * rr * 0.6;
                    ctx.fillStyle = `hsl(${f.hue - k * 18},${f.sat}%,${L - k * 6}%)`;
                    ctx.beginPath(); ctx.ellipse(off - rr * 0.5, yy, rr, rr * 0.8, 0.5, 0, 6.283); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(off + rr * 0.6, yy + rr * 0.3, rr, rr * 0.8, -0.5, 0, 6.283); ctx.fill();
                }
            }
            ctx.restore();
        }

        /* ---------- man with a lantern ---------- */
        function limb(x1, y1, x2, y2, w, col) {
            ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        function drawMan(t) {
            const s = mScale() * 1.3, ph = man.phase, gy = hill(man.x, 1) + 12 * s;
            const bob = Math.abs(Math.sin(ph)) * 2.4;
            const dark = '#17081a', trouser = '#10050f';

            ctx.save(); ctx.translate(man.x, gy); ctx.scale(s, s);

            // contact shadow
            ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0, 1, 18, 4, 0, 0, 6.283); ctx.fill();

            // legs
            const leg = (p) => {
                const a = Math.sin(p) * 0.55, bend = 0.12 + 0.6 * Math.max(0, Math.cos(p));
                const hx = 0, hy = -50 + bob * 0.4;
                const kx = hx + Math.sin(a) * 25, ky = hy + Math.cos(a) * 25;
                const b = a - bend;
                const fx = kx + Math.sin(b) * 25, fy = Math.min(0, ky + Math.cos(b) * 25);
                limb(hx, hy, kx, ky, 8, trouser); limb(kx, ky, fx, fy, 7, trouser);
                ctx.fillStyle = '#0a030a'; ctx.beginPath(); ctx.ellipse(fx + 3, fy - 1, 6, 3, 0, 0, 6.283); ctx.fill();
            };
            leg(ph + Math.PI);

            // back arm
            const sa = -Math.sin(ph) * 0.55;
            limb(-2, -88 + bob, -2 + Math.sin(sa) * 28, -88 + bob + Math.cos(sa) * 28, 6.5, dark);

            // coat
            const sw = Math.sin(ph) * 3.2, y0 = bob;
            ctx.fillStyle = dark; ctx.strokeStyle = 'rgba(255,165,215,.38)'; ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(-9, -92 + y0);
            ctx.quadraticCurveTo(-14, -66 + y0, -15 + sw, -33 + y0);
            ctx.lineTo(-3, -31 + y0); ctx.lineTo(2, -35 + y0); ctx.lineTo(16 + sw, -32 + y0);
            ctx.quadraticCurveTo(12, -66 + y0, 9, -92 + y0);
            ctx.quadraticCurveTo(0, -97 + y0, -9, -92 + y0);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            // scarf that streams behind in the breeze
            ctx.strokeStyle = '#ff8fc8'; ctx.lineWidth = 4.2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-3, -91 + y0);
            ctx.bezierCurveTo(-14, -90 + y0 + Math.sin(t * 0.006) * 2, -22, -84 + y0 + Math.sin(t * 0.005 + 1) * 4, -34, -86 + y0 + Math.sin(t * 0.0045) * 6);
            ctx.stroke();
            ctx.lineWidth = 5; ctx.strokeStyle = '#f26aa8';
            ctx.beginPath(); ctx.moveTo(-8, -91 + y0); ctx.lineTo(7, -91 + y0); ctx.stroke();

            // head + hat
            ctx.fillStyle = dark;
            ctx.beginPath(); ctx.arc(2, -103 + y0, 7.4, 0, 6.283); ctx.fill();
            ctx.strokeStyle = 'rgba(255,165,215,.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(2, -103 + y0, 7.4, 3.5, 5.1); ctx.stroke();
            ctx.fillStyle = '#12050f';
            ctx.beginPath(); ctx.ellipse(2, -108 + y0, 14, 3.1, 0, 0, 6.283); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-5, -108 + y0); ctx.quadraticCurveTo(-4, -121 + y0, 2, -121 + y0); ctx.quadraticCurveTo(9, -121 + y0, 9, -108 + y0); ctx.fill();
            ctx.fillStyle = '#f26aa8'; ctx.fillRect(-5, -111.5 + y0, 14, 2.4);

            // front leg
            leg(ph);

            // lantern arm (reaches forward, gentle sway)
            const hx = 16, hy = -68 + y0 + Math.sin(ph * 2) * 0.8;
            limb(3, -88 + y0, 11, -76 + y0, 6.5, dark); limb(11, -76 + y0, hx, hy, 6, dark);
            const sway = Math.sin(t * 0.004) * 2 + Math.sin(ph) * 1.4;
            limb(hx, hy, hx + sway * 0.5, hy + 8, 1.2, '#2a1020');
            const lx0 = hx + sway * 0.5, ly0 = hy + 8;
            ctx.fillStyle = '#2a1424'; ctx.fillRect(lx0 - 4.5, ly0 - 1, 9, 2);
            ctx.fillStyle = '#fff0c8'; ctx.fillRect(lx0 - 3.2, ly0 + 1, 6.4, 8);
            ctx.fillStyle = '#2a1424'; ctx.fillRect(lx0 - 4.5, ly0 + 9, 9, 2);

            // store world position for lighting
            const tr = ctx.getTransform();
            lantern = { x: tr.e / dpr + lx0 * s, y: tr.f / dpr + (ly0 + 5) * s, r: 230 * s };
            ctx.restore();
        }

        /* ---------- frame ---------- */
        let last = 0;
        function frame(now) {
            const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
            const t = now;

            man.x += man.speed * dt * mScale();
            man.phase += man.speed * dt * mScale() * (6.283 / (88 * mScale()));
            if (man.x > W + 120) man.x = -140;

            /* sky */
            const sky = ctx.createLinearGradient(0, 0, 0, H * 0.8);
            sky.addColorStop(0, '#06010d'); sky.addColorStop(0.35, '#16041a');
            sky.addColorStop(0.7, '#3f0d37'); sky.addColorStop(1, '#7c2a5a');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

            /* stars */
            for (const s of stars) {
                const a = 0.25 + (Math.sin(t * 0.001 * s.sp + s.a * 20) + 1) * 0.36;
                ctx.fillStyle = `rgba(${s.tint},${a})`;
                ctx.fillRect(s.x, s.y, s.s, s.s);
            }

            /* galaxy */
            const gx = W / 2, gy = H * 0.27, spin = t * 0.00004, gs = Math.min(1, W / 900);
            ctx.save(); ctx.translate(gx, gy); ctx.rotate(0.45); ctx.scale(gs, gs);
            ctx.globalCompositeOperation = 'lighter';
            ctx.save(); ctx.scale(1, 0.42);
            let g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, 340);
            g1.addColorStop(0, 'rgba(255,235,245,.9)'); g1.addColorStop(0.12, 'rgba(255,140,200,.55)');
            g1.addColorStop(0.45, 'rgba(180,70,190,.2)'); g1.addColorStop(1, 'rgba(90,20,110,0)');
            ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(0, 0, 340, 0, 6.283); ctx.fill(); ctx.restore();
            for (const p of galaxy) {
                const a = p.th + spin * (1.6 - p.r / 260);
                const x = Math.cos(a) * p.r, y = Math.sin(a) * p.r * 0.42;
                const k = p.r / 300;
                ctx.fillStyle = k < 0.2 ? `rgba(255,240,230,${p.a})` : (k < 0.55 ? `rgba(255,160,215,${p.a})` : `rgba(200,150,255,${p.a * 0.8})`);
                ctx.fillRect(x, y, p.s, p.s);
            }
            ctx.globalCompositeOperation = 'source-over'; ctx.restore();

            /* shooting stars */
            ctx.lineWidth = 2; ctx.lineCap = 'round';
            for (let i = shooting.length - 1; i >= 0; i--) {
                const st = shooting[i], dx = Math.cos(st.angle) * st.len, dy = Math.sin(st.angle) * st.len;
                const gr = ctx.createLinearGradient(st.x, st.y, st.x - dx, st.y - dy);
                gr.addColorStop(0, `rgba(255,255,255,${st.o})`); gr.addColorStop(1, 'rgba(255,200,235,0)');
                ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(st.x - dx, st.y - dy); ctx.stroke();
                st.x += Math.cos(st.angle) * st.speed * dt * 60; st.y += Math.sin(st.angle) * st.speed * dt * 60; st.o -= 1.2 * dt;
                if (st.o <= 0) shooting.splice(i, 1);
            }

            /* horizon glow + distant ridges */
            const hg = ctx.createRadialGradient(W * 0.5, H * 0.7, 10, W * 0.5, H * 0.7, W * 0.6);
            hg.addColorStop(0, 'rgba(255,120,190,.28)'); hg.addColorStop(1, 'rgba(255,120,190,0)');
            ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);
            [[0, 'rgba(70,16,66,.75)'], [1, 'rgba(46,10,48,.9)']].forEach(([k, col]) => {
                ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
                for (let x = 0; x <= W; x += 10) ctx.lineTo(x, ridge(x, k));
                ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
            });

            /* mist drifting between hills */
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 4; i++) {
                const mx = ((t * 0.006 * (1 + i * 0.3) + i * 380) % (W + 700)) - 350;
                ctx.globalAlpha = 0.16; ctx.drawImage(MIST, mx - 300, H * (0.64 + i * 0.03), 700, 150);
            }
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

            /* hill layers */
            const fillHill = (layer, c1, c2) => {
                const top = hill(W / 2, layer) - H * 0.04;
                const gr = ctx.createLinearGradient(0, top, 0, H);
                gr.addColorStop(0, c1); gr.addColorStop(1, c2);
                ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, H);
                for (let x = 0; x <= W + 10; x += 8) ctx.lineTo(x, hill(x, layer));
                ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
            };
            fillHill(0, '#2c0c2c', '#1a0619');
            for (const f of flowers) if (f.layer === 0) drawFlower(f, t);
            fillHill(1, '#240a24', '#10030f');

            /* flowers behind the walker */
            for (const f of flowers) if (f.layer === 1 && !f.front) drawFlower(f, t);

            drawMan(t);

            /* flowers in front of the walker */
            for (const f of flowers) if (f.layer === 1 && f.front) drawFlower(f, t);

            /* lantern light spilling on the meadow */
            if (lantern.r) {
                ctx.globalCompositeOperation = 'lighter';
                const lg = ctx.createRadialGradient(lantern.x, lantern.y, 0, lantern.x, lantern.y, lantern.r);
                lg.addColorStop(0, 'rgba(255,215,150,.55)'); lg.addColorStop(0.3, 'rgba(255,170,130,.22)'); lg.addColorStop(1, 'rgba(255,140,170,0)');
                ctx.fillStyle = lg; ctx.fillRect(lantern.x - lantern.r, lantern.y - lantern.r, lantern.r * 2, lantern.r * 2);
                ctx.globalCompositeOperation = 'source-over';
            }

            /* foreground hill + giant blooms */
            fillHill(2, '#13041a', '#050106');
            for (const f of flowers) if (f.layer === 2) drawFlower(f, t);

            /* fireflies */
            ctx.globalCompositeOperation = 'lighter';
            for (const fl of fireflies) {
                const x = fl.x + Math.sin(t * 0.0004 * fl.sp + fl.ph) * 60 + Math.sin(t * 0.0011 + fl.ph) * 14;
                const y = fl.y + Math.cos(t * 0.0005 * fl.sp + fl.ph * 2) * 30;
                const a = Math.max(0, Math.sin(t * 0.0018 * fl.sp + fl.ph)) ;
                ctx.globalAlpha = a * 0.9; ctx.drawImage(GLOW[3], x - fl.r / 2, y - fl.r / 2, fl.r, fl.r);
                ctx.globalAlpha = a; ctx.fillStyle = '#fff6d0'; ctx.fillRect(x - 1, y - 1, 2, 2);
            }
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

            /* drifting petals */
            for (const p of petals) {
                p.y += p.vy * dt; p.x += (p.vx + Math.sin(t * 0.0007 + p.sw) * 16) * dt; p.a += p.sp * dt;
                if (p.y > H + 20) Object.assign(p, newPetal(false));
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
                ctx.scale(1, Math.abs(Math.cos(p.a * 0.7)) * 0.7 + 0.3);
                ctx.fillStyle = `rgba(${p.c},${p.blur ? 0.28 : 0.75})`;
                const sz = p.blur ? p.s * 2.6 : p.s;
                ctx.beginPath(); ctx.moveTo(0, -sz * 0.5); ctx.quadraticCurveTo(sz, -sz * 0.6, sz, 0); ctx.quadraticCurveTo(sz * 0.5, sz * 0.6, 0, sz * 0.5); ctx.quadraticCurveTo(-sz * 0.3, 0, 0, -sz * 0.5);
                ctx.fill(); ctx.restore();
            }

            /* vignette + film grain-ish veil */
            const v = ctx.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.8);
            v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
            ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(frame);
        }

        setInterval(() => {
            if (document.hidden) return;
            shooting.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.3, len: 60 + Math.random() * 80,
                            speed: 7 + Math.random() * 6, angle: Math.PI / 4 + (Math.random() * 0.3 - 0.15), o: 1 });
        }, 3500);

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
