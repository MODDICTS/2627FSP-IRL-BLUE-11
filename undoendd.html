<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UndoEnd - Mobile Web Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0d19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            background: #121629;
            border: 1px solid #2a3459;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            border-bottom: 1px solid #2a3459;
            padding-bottom: 12px;
        }

        h1 {
            color: #4db8ff;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #8a99ad;
            margin-top: 4px;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .screen.active {
            display: flex;
        }

        p {
            line-height: 1.5;
            color: #d1d5db;
            font-size: 0.95rem;
        }

        /* Character Grid for Mobile */
        .char-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 480px) {
            .char-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .char-card {
            background: #1c233d;
            border: 2px solid #34426e;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .char-card:active {
            border-color: #4db8ff;
            background: #252e50;
        }

        .char-card h3 {
            color: #ffb84d;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .char-card p {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        /* Status Bar */
        #status-bar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #1c233d;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border-left: 4px solid #4db8ff;
        }

        /* Story Box */
        #story-text {
            background: #080a14;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #2a3459;
            min-height: 120px;
        }

        /* Mobile Friendly Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            background: #2a3459;
            color: #ffffff;
            border: 1px solid #4db8ff;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .game-btn:active {
            background: #4db8ff;
            color: #0b0d19;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>UndoEnd</h1>
        <div class="subtitle">By Moddicts | Sci-Fi Choice-Driven Game</div>
    </header>

    <div id="start-screen" class="screen active
